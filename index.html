<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BOOYAH! - Mini Battle Royale</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none}
  body{background:#111;font-family:Arial;overflow:hidden;color:white}
  #game{width:100vw;height:100vh;background:#1a3a1a;position:relative;overflow:hidden}
  #player{width:40px;height:40px;background:#ffcc00;border-radius:50%;position:absolute;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:10}
  .enemy{width:38px;height:38px;background:#ff3333;border-radius:50%;position:absolute;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:20px}
  .bullet{width:8px;height:8px;background:yellow;border-radius:50%;position:absolute;z-index:5}
  #hud{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;z-index:20;font-weight:bold}
  #healthBar{width:120px;height:14px;background:#333;border-radius:10px;overflow:hidden}
  #healthFill{width:100%;height:100%;background:#00e676;transition:0.2s}
  #joystick{position:absolute;bottom:90px;left:20px;width:110px;height:110px;background:rgba(255,255,255,0.15);border-radius:50%;z-index:20}
  #stick{width:50px;height:50px;background:rgba(255,255,255,0.5);border-radius:50%;position:absolute;top:30px;left:30px}
  #fireBtn{position:absolute;bottom:110px;right:25px;width:80px;height:80px;background:#ff2222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid white;z-index:20}
  #startScreen{position:absolute;inset:0;background:linear-gradient(#ff6b00,#d50000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center}
  #startScreen h1{font-size:50px;text-shadow:3px 3px 0 #000}
  #startScreen p{margin:10px}
  button{padding:15px 40px;font-size:20px;font-weight:bold;background:#ffcc00;border:none;border-radius:30px;margin-top:15px}
  #killMsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:bold;color:#ffcc00;display:none;z-index:25;text-shadow:2px 2px 0 #000}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div>❤️ <div id="healthBar"><div id="healthFill"></div></div></div>
    <div>🏆 KILLS: <span id="kills">0</span></div>
    <div>👥 LEFT: <span id="left">10</span></div>
  </div>
  <div id="player">🪖</div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="fireBtn">🔫</div>
  <div id="killMsg">BOOYAH! KILL! 🔥</div>

  <div id="startScreen">
    <h1>BOOYAH!</h1>
    <p>Mini Battle Royale</p>
    <p>Joystick la move pannu<br>Red button la suttu kill pannu</p>
    <button onclick="startGame()">▶ START MATCH</button>
    <p style="font-size:12px;margin-top:20px">Free Fire Style - Fan Made Game</p>
  </div>
</div>

<script>
let px=200, py=300, health=100, kills=0, enemies=[], bullets=[], gameOn=false;
let joyX=0, joyY=0, isJoy=false;
const player=document.getElementById('player');
const game=document.getElementById('game');

function startGame(){
  document.getElementById('startScreen').style.display='none';
  gameOn=true; spawnEnemies(); loop();
}
function spawnEnemies(){
  enemies=[];
  document.querySelectorAll('.enemy').forEach(e=>e.remove());
  for(let i=0;i<10;i++){
    let e=document.createElement('div');
    e.className='enemy'; e.textContent='💀';
    let x=Math.random()*window.innerWidth, y=Math.random()*window.innerHeight;
    e.style.left=x+'px'; e.style.top=y+'px';
    game.appendChild(e);
    enemies.push({el:e,x,y,hp:3});
  }
  document.getElementById('left').textContent=enemies.length;
}
function loop(){
  if(!gameOn) return;
  // player move
  px+=joyX*5; py+=joyY*5;
  px=Math.max(0,Math.min(window.innerWidth-40,px));
  py=Math.max(0,Math.min(window.innerHeight-40,py));
  player.style.left=px+'px'; player.style.top=py+'px';

  // enemies move towards player
  enemies.forEach(en=>{
    let dx=px-en.x, dy=py-en.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    en.x+=dx/d*0.8; en.y+=dy/d*0.8;
    en.el.style.left=en.x+'px'; en.el.style.top=en.y+'px';
    // touch player = damage
    if(d<40){ health-=0.5; document.getElementById('healthFill').style.width=health+'%';
      if(health<=0){ alert('GAME OVER! Kills: '+kills); location.reload(); }
    }
  });

  // bullets
  bullets.forEach((b,i)=>{
    b.x+=b.vx; b.y+=b.vy;
    b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px';
    enemies.forEach((en,ei)=>{
      let dx=b.x-en.x, dy=b.y-en.y;
      if(Math.sqrt(dx*dx+dy*dy)<30){
        en.hp--; b.el.remove(); bullets.splice(i,1);
        if(en.hp<=0){
          en.el.remove(); enemies.splice(ei,1);
          kills++; document.getElementById('kills').textContent=kills;
          document.getElementById('left').textContent=enemies.length;
          let m=document.getElementById('killMsg'); m.style.display='block';
          setTimeout(()=>m.style.display='none',600);
          if(enemies.length==0){ alert('🏆 BOOYAH! WINNER WINNER!'); location.reload(); }
        }
      }
    });
    if(b.x<0||b.x>window.innerWidth||b.y<0||b.y>window.innerHeight){ b.el.remove(); bullets.splice(i,1); }
  });
  requestAnimationFrame(loop);
}
function shoot(){
  if(!gameOn) return;
  // shoot to nearest enemy
  let nearest=null, best=9999;
  enemies.forEach(en=>{ let d=Math.hypot(en.x-px,en.y-py); if(d<best){best=d;nearest=en;} });
  if(!nearest) return;
  let dx=nearest.x-px, dy=nearest.y-py, d=Math.hypot(dx,dy)||1;
  let b=document.createElement('div'); b.className='bullet';
  game.appendChild(b);
  bullets.push({el:b,x:px+20,y:py+20,vx:dx/d*12,vy:dy/d*12});
}
document.getElementById('fireBtn').addEventListener('touchstart',shoot);
document.getElementById('fireBtn').addEventListener('click',shoot);

// Joystick
let joy=document.getElementById('joystick'), stick=document.getElementById('stick');
joy.addEventListener('touchstart',e=>isJoy=true);
joy.addEventListener('touchmove',e=>{
  let t=e.touches[0], r=joy.getBoundingClientRect();
  let dx=t.clientX-(r.left+55), dy=t.clientY-(r.top+55);
  let d=Math.hypot(dx,dy)||1; if(d>40){dx=dx/d*40; dy=dy/d*40;}
  stick.style.left=(30+dx)+'px'; stick.style.top=(30+dy)+'px';
  joyX=dx/40; joyY=dy/40;
});
joy.addEventListener('touchend',()=>{ isJoy=false; joyX=0; joyY=0; stick.style.left='30px'; stick.style.top='30px'; });
</script>
</body>
</html>
